<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>برنامج المطابقة</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e3ecea;color:#12352a;font-family:Tahoma,Arial,sans-serif}
main{width:min(520px,calc(100% - 36px));padding:32px 24px;text-align:center;background:#fff;border:1px solid #cfdcd8;border-radius:24px;box-shadow:0 18px 50px #12352a12}
.mark{width:76px;height:76px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;background:#dcebe4;color:#1d5a40;font-size:38px}
h1{margin:0 0 10px;font-size:25px}p{margin:0;color:#59656d;line-height:1.8}
</style>
</head>
<body><main><div class="mark">⇄</div><h1>برنامج المطابقة</h1><p>هذا المجلد جاهز لإضافة ملفات البرنامج.</p></main></body>
</html>
