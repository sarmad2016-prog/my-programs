<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>my programs</title>
<meta name="theme-color" content="#0d3f29">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
:root{--g900:#0d3f29;--g700:#1d5a40;--g500:#2f7a5c;--g100:#dcebe4;--mist:#e3ecea;--sky:#eaf6fc;--ink:#12352a;--muted:#59656d;--line:#cfdcd8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(160deg,var(--mist),#f7fbf9 55%,var(--sky));color:var(--ink)}
header{background:linear-gradient(135deg,var(--g900),var(--g700));color:#fff;padding:28px 18px 42px}
.wrap{width:min(980px,calc(100% - 28px));margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:52px;height:52px;border-radius:16px;background:#ffffff1c;display:grid;place-items:center;font-size:28px}
h1{font-size:clamp(25px,5vw,38px);margin:0}
.install{border:1px solid #ffffff70;background:#ffffff18;color:white;border-radius:12px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}
main{padding:30px 0 50px}
.section-head{margin-bottom:17px}
.section-head h2{margin:0;font-size:23px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,250px));gap:16px}
.app-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 20px;box-shadow:0 8px 24px #12352a0d;display:flex;flex-direction:column;align-items:flex-start;min-height:174px;text-decoration:none;color:var(--ink);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.app-card:hover{transform:translateY(-4px);box-shadow:0 13px 28px #12352a18;border-color:var(--g500)}
.app-card:focus-visible{outline:3px solid var(--g500);outline-offset:3px}
.app-icon{width:62px;height:62px;border-radius:18px;background:var(--g100);display:grid;place-items:center;font-size:32px;margin-bottom:17px}
.app-card h3{font-size:19px;margin:0}
@media(max-width:520px){header{padding-top:22px}.top{align-items:center}.install{width:100%}.grid{grid-template-columns:1fr}.app-card{min-height:145px}}
</style>
</head>
<body>
<header><div class="wrap top">
 <div class="brand"><div class="logo">🗂️</div><div><h1>my programs</h1></div></div>
 <button class="install" id="installLibrary" type="button">⬇ تثبيت المكتبة</button>
</div></header>
<main class="wrap">
 <div class="section-head"><h2>برامجي</h2></div>
 <section class="grid" aria-label="قائمة البرامج">
  <a class="app-card" href="./promoters/" aria-label="فتح نظام المروجين">
   <div class="app-icon" aria-hidden="true">🏪</div>
   <h3>نظام المروجين</h3>
  </a>
 </section>
</main>
<script>
let libraryPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();libraryPrompt=e;});
async function installPwa(promptRef){if(promptRef){promptRef.prompt();await promptRef.userChoice;return true;}alert("إذا لم تظهر نافذة التثبيت، افتح قائمة المتصفح ⋮ واختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».");return false;}
document.getElementById("installLibrary").addEventListener("click",()=>installPwa(libraryPrompt));
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script>
</body></html>
